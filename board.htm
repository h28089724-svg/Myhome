    img.altsrc = null;
  }
}
function na_change_img_src(name, nsdoc, rpath, preload){
  var img = document.getElementsByName(name)[0];
  if (img) {
    img.altsrc = img.src;
    img.src = rpath;
  }
}
function na_preload_img(){
  if (document.preloadlist == null) document.preloadlist = [];

  function togglePanel(element, button, openText, closeText) {

  function escapeHtml(text) {
    return String(text == null ? "" : text)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  // 수정확인: 날짜 표시는 반드시 YY-MM-DD/HH:mm 형식으로 표시합니다. 예: 26-06-01/23:38
  // Firestore Timestamp, Date, 숫자 timestamp, ISO 문자열, 한국어 날짜 문자열을 모두 같은 형식으로 강제 변환합니다.
  function twoDigit(num) {
    num = Number(num);
    if (isNaN(num)) num = 0;
    return num < 10 ? "0" + num : String(num);
  }

  function parseDateValue(value) {
    if (value == null || value === "") return null;

    // Firestore Timestamp compat 객체
    if (value && typeof value.toDate === "function") {
      return value.toDate();
    }

    // Date 객체
    if (value instanceof Date) {
      return value;
    }

    // Firestore Timestamp가 일반 객체로 넘어온 경우
    if (value && typeof value.seconds === "number") {
      return new Date(value.seconds * 1000);
    }
    if (value && typeof value._seconds === "number") {
      return new Date(value._seconds * 1000);
    }

    // 숫자 timestamp
    if (typeof value === "number") {
      // 10자리 초 단위 timestamp와 13자리 밀리초 timestamp 모두 대응
      return new Date(value < 10000000000 ? value * 1000 : value);
    }

    // 문자열 날짜
    if (typeof value === "string") {
      var text = value.trim();
      if (!text) return null;

      // 이미 원하는 모양과 비슷한 경우도 다시 Date로 만들지 말고 직접 분해합니다.
      // 예: 26-06-01/23:38, 2026. 6. 1. 오후 11:38, 2026년 6월 1일 23:38
      var dateMatch = text.match(/(\d{2,4})\D+(\d{1,2})\D+(\d{1,2})/);
      if (dateMatch) {
        var year = Number(dateMatch[1]);
        if (year < 100) year += 2000;
        var month = Number(dateMatch[2]) - 1;
        var day = Number(dateMatch[3]);

        var rest = text.slice(dateMatch.index + dateMatch[0].length);
        var hour = 0;
        var minute = 0;
        var timeMatch = rest.match(/(\d{1,2})\D+(\d{1,2})/);
        if (timeMatch) {
          hour = Number(timeMatch[1]);
          minute = Number(timeMatch[2]);
        }

        var ampm = "";
        if (/오후|PM|pm/.test(text)) ampm = "pm";
        if (/오전|AM|am/.test(text)) ampm = "am";
        if (ampm === "pm" && hour < 12) hour += 12;
        if (ampm === "am" && hour === 12) hour = 0;

        return new Date(year, month, day, hour, minute);
      }

      // ISO 등 브라우저가 해석할 수 있는 문자열
      var parsed = new Date(text);
      if (!isNaN(parsed.getTime())) return parsed;
    }

    return null;
  }

  function formatDate(value) {
    var date = parseDateValue(value);
    if (!date || isNaN(date.getTime())) return "";

    var yy = String(date.getFullYear()).slice(-2);
    var mm = twoDigit(date.getMonth() + 1);
    var dd = twoDigit(date.getDate());
    var hh = twoDigit(date.getHours());
    var mi = twoDigit(date.getMinutes());

    return yy + "-" + mm + "-" + dd + "/" + hh + ":" + mi;
  }

  // 혹시 기존 데이터의 날짜 필드명이 createdAt이 아닐 경우까지 같이 확인합니다.
  function getPostDateText(post) {
    var value = post.createdAt || post.date || post.createdDate || post.writeDate || post.writtenAt || post.timestamp || post.time || post.created_at;
    return formatDate(value);
  }

  // 첨부 링크가 없는 글은 '-'로 표시합니다. 링크가 있으면 이미지/동영상/문서 버튼으로 표시하고 팝업으로 엽니다.
  function getAttachmentData(post) {
    var url = post.attachmentUrl || post.attachmentLink || post.fileUrl || post.downloadUrl || "";
    var name = post.attachmentName || post.fileName || post.filename || "";

    if (post.attachments && post.attachments.length) {
      var first = post.attachments[0] || {};
      url = first.url || first.link || first.downloadUrl || url;
      name = first.name || first.fileName || first.filename || name;
    }

    var savedKind = post.attachmentKind || post.fileKind || post.kind || "";
    if (savedKind !== "image" && savedKind !== "video" && savedKind !== "doc") {
      savedKind = detectAttachmentKind(url, name);
    }

    return {
      url: url,
      name: name || "첨부파일",
      kind: savedKind
    };
  }

  function detectAttachmentKind(url, name) {
    var rawText = String(url || "") + " " + String(name || "");
    var text = rawText.toLowerCase();
    try {
      text = decodeURIComponent(text);
    } catch (e) {}

    var beforeQuery = text.split("?")[0].split("#")[0];

    if (/\.(jpg|jpeg|png|gif|webp|bmp|svg)(?:$|[\s\/?#&=._-])/i.test(beforeQuery + " ")) return "image";
    if (/\.(mp4|webm|ogg|ogv|mov|m4v|avi|wmv|asf|mpeg|mpg|3gp|mkv)(?:$|[\s\/?#&=._-])/i.test(beforeQuery + " ")) return "video";
    if (/\.(pdf|doc|docx|xls|xlsx|ppt|pptx|txt|hwp|hwpx|zip|dwg|dxf)(?:$|[\s\/?#&=._-])/i.test(beforeQuery + " ")) return "doc";

    // Google Drive 공유 링크처럼 주소에 확장자가 사라지는 경우를 위해 표시명/링크 전체에 확장자 단어가 있으면 한 번 더 판단합니다.
    if (/(^|[\s._%-])(mp4|webm|ogg|ogv|mov|m4v|avi|wmv|asf|mpeg|mpg|3gp|mkv)($|[\s._%-])/i.test(text)) return "video";
    if (/(^|[\s._%-])(jpg|jpeg|png|gif|webp|bmp|svg)($|[\s._%-])/i.test(text)) return "image";

    if (/drive\.google\.com|docs\.google\.com/i.test(text)) return "doc";
    return "doc";
  }

  function getAttachmentLabel(kind) {
    if (kind === "image") return "이미지";
    if (kind === "video") return "동영상";
    return "문서";
  }

  function getAttachmentClass(kind) {
    if (kind === "image") return "image-type";
    if (kind === "video") return "video-type";
    return "doc-type";
  }

  function getAttachmentHtml(post) {
    var data = getAttachmentData(post);
    if (!data.url) return "-";

    return '<button type="button" class="attachment-open-btn ' + getAttachmentClass(data.kind) + '" ' +
      'data-url="' + escapeHtml(data.url) + '" ' +
      'data-name="' + escapeHtml(data.name) + '" ' +
      'data-kind="' + escapeHtml(data.kind) + '">' +
      escapeHtml(getAttachmentLabel(data.kind)) +
      '</button>';
  }

  function getAttachmentDetailHtml(post) {
    var html = getAttachmentHtml(post);
    if (!html || html === "-") return "";
    return '<div class="detail-meta">첨부: ' + html + '</div>';
  }

  function convertGoogleDrivePreviewUrl(url) {
    var text = String(url || "");
    var match = text.match(/\/file\/d\/([^\/]+)/);
    if (match && match[1]) {
      return "https://drive.google.com/file/d/" + match[1] + "/preview";
    }

    match = text.match(/[?&]id=([^&]+)/);
    if (match && match[1] && text.indexOf("drive.google.com") > -1) {
      return "https://drive.google.com/file/d/" + match[1] + "/preview";
    }

    return text;
  }

  function getUrlExtension(url, name) {
    var text = String(name || "") + " " + String(url || "");
    try { text = decodeURIComponent(text); } catch (e) {}
    var match = text.toLowerCase().match(/\.([a-z0-9]{2,5})(?:$|[\s\/\?#&=._-])/);
    return match && match[1] ? match[1] : "";
  }

  function isBrowserPlayableVideo(ext, url) {
    var text = String(url || "").toLowerCase();
    if (/drive\.google\.com|docs\.google\.com/.test(text)) return false;
    return /^(mp4|webm|ogg|ogv|m4v)$/.test(String(ext || "").toLowerCase());
  }

  function makeAttachmentActionButtons(url) {
    var safeUrl = escapeHtml(url);
    return '<div class="attachment-popup-actions">' +
      '<a class="attachment-popup-action-btn" href="' + safeUrl + '" target="_blank" rel="noopener">파일 열기</a>' +
      '<a class="attachment-popup-action-btn" href="' + safeUrl + '" target="_blank" rel="noopener" download>다운로드</a>' +
      '</div>';
  }

  function openAttachmentPopup(url, name, kind) {
    currentAttachmentUrl = url || "";
    attachmentPopupTitle.innerHTML = escapeHtml(name || getAttachmentLabel(kind));
    attachmentPopupBody.innerHTML = "";

    if (!currentAttachmentUrl) return;

    if (kind === "image") {
      attachmentPopupBody.innerHTML = '<img src="' + escapeHtml(currentAttachmentUrl) + '" alt="' + escapeHtml(name || "이미지") + '">' +
        makeAttachmentActionButtons(currentAttachmentUrl);
    } else if (kind === "video") {
      var ext = getUrlExtension(currentAttachmentUrl, name);
      var previewUrl = convertGoogleDrivePreviewUrl(currentAttachmentUrl);

      if (isBrowserPlayableVideo(ext, currentAttachmentUrl)) {
        attachmentPopupBody.innerHTML = '<video src="' + escapeHtml(currentAttachmentUrl) + '" controls playsinline></video>' +
          makeAttachmentActionButtons(currentAttachmentUrl) +
          '<div class="attachment-popup-message">브라우저 정책상 소리가 있는 동영상은 자동재생이 차단될 수 있습니다. 화면 안의 재생 버튼으로 실행하세요.</div>';
      } else {
        attachmentPopupBody.innerHTML = '<iframe src="' + escapeHtml(previewUrl) + '"></iframe>' +
          makeAttachmentActionButtons(currentAttachmentUrl) +
          '<div class="attachment-popup-message"><b>WMV/AVI/MKV 같은 파일은 브라우저 팝업 안에서 바로 재생되지 않을 수 있습니다.</b><br>위 미리보기가 작동하지 않으면 <b>파일 열기</b> 또는 <b>다운로드</b> 버튼을 눌러 확인하세요. 오른쪽 위 <b>전체창 보기</b>는 사용자가 선택할 때만 새 창으로 엽니다.</div>';
      }
    } else {
      var docPreviewUrl = convertGoogleDrivePreviewUrl(currentAttachmentUrl);
      attachmentPopupBody.innerHTML = '<iframe src="' + escapeHtml(docPreviewUrl) + '"></iframe>' +
        makeAttachmentActionButtons(currentAttachmentUrl) +
        '<div class="attachment-popup-message">문서 미리보기가 표시되지 않으면 <b>파일 열기</b>, <b>다운로드</b> 또는 오른쪽 위 <b>전체창 보기</b> 버튼으로 확인하세요.</div>';
    }

    attachmentPopupMask.style.display = "block";
  }

  function closeAttachmentPopup() {
    attachmentPopupMask.style.display = "none";
    attachmentPopupBody.innerHTML = "";
    currentAttachmentUrl = "";
  }

  function normalizeAttachmentUrl(url) {
    url = String(url || "").trim();
    if (!url) return "";
    if (!/^https?:\/\//i.test(url)) {
      url = "https://" + url;
    }
    return url;
  }

  function getAttachmentLinkData() {
    var url = normalizeAttachmentUrl(attachmentUrlInput ? attachmentUrlInput.value : "");
    var name = attachmentNameInput ? attachmentNameInput.value.trim() : "";
    var kind = attachmentKindInput ? attachmentKindInput.value : "auto";

    if (!url) {
      return {
        attachmentUrl: "",
        attachmentName: "",
        attachmentKind: ""
      };
    }

    if (kind !== "image" && kind !== "video" && kind !== "doc") {
      kind = detectAttachmentKind(url, name);
    }

    return {
      attachmentUrl: url,
      attachmentName: name || "보기",
      attachmentKind: kind
    };
  }

  function resetWriteForm() {
    editingPostId = null;
    writeForm.reset();
    writerInput.value = isAdmin ? "관리자" : "";
    writeTitleText.innerHTML = "새 글 쓰기";
    editingLabel.innerHTML = "";
    savePostBtn.innerHTML = "저장";
    cancelEditBtn.style.display = "none";

  function updateAuthUI() {
    if (isAdmin) {
      loginArea.style.display = "none";
      logoutArea.style.display = "flex";
      loginInfo.innerHTML = "관리자 로그인 중: " + escapeHtml(currentUser.email);
      adminHead.style.display = "";
      setAuthMessage("관리자 권한으로 수정·삭제가 가능합니다.", false);
    } else {
      resetWriteForm();
      loginArea.style.display = "flex";
      logoutArea.style.display = "none";
      loginInfo.innerHTML = "";
      adminHead.style.display = "none";

      if (currentUser && currentUser.email !== ADMIN_EMAIL) {
        setAuthMessage("관리자 이메일이 아닙니다.", false);
      } else {
        setAuthMessage("", false);
      }
    }

    renderPosts(cachedPosts);
  }

  function renderPosts(posts) {
    var colspan = isAdmin ? 6 : 5;

    if (!posts.length) {
      boardList.innerHTML = '<tr><td colspan="' + colspan + '" class="empty">등록된 글이 없습니다.</td></tr>';
      boardDetail.innerHTML = '<div class="detail-empty">위쪽 목록에서 글을 선택하면 내용이 표시됩니다.</div>';
      return;
    }

    var html = "";
    for (var i = 0; i < posts.length; i++) {
      var post = posts[i];
      html += '<tr class="post-row" data-id="' + escapeHtml(post.id) + '">' +
        '<td class="no">' + (posts.length - i) + '</td>' +
        '<td class="title">' + escapeHtml(post.title || "(제목 없음)") + '</td>' +
        '<td class="writer">' + escapeHtml(post.writer || "글쓴이 없음") + '</td>' +
        '<td class="attach">' + getAttachmentHtml(post) + '</td>' +
        '<td class="date">' + escapeHtml(getPostDateText(post)) + '</td>';

      if (isAdmin) {
        html += '<td class="admin-col">' +
          '<button type="button" class="edit-btn" data-edit-id="' + escapeHtml(post.id) + '">수정</button>' +
          '<button type="button" class="delete-btn" data-delete-id="' + escapeHtml(post.id) + '">삭제</button>' +
          '</td>';
      }

      html += '</tr>';
    }
    boardList.innerHTML = html;

    var rows = document.querySelectorAll(".post-row");
    for (var r = 0; r < rows.length; r++) {
      rows[r].onclick = function(e) {
        if (e.target && (e.target.getAttribute("data-delete-id") || e.target.getAttribute("data-edit-id") || String(e.target.className || "").indexOf("attachment-open-btn") > -1)) return;
        var id = this.getAttribute("data-id");
        for (var j = 0; j < cachedPosts.length; j++) {
          if (cachedPosts[j].id === id) {
            renderDetail(cachedPosts[j]);
            break;
          }
        }
      };
    }

    var editBtns = document.querySelectorAll(".edit-btn");
    for (var e = 0; e < editBtns.length; e++) {
      editBtns[e].onclick = function(ev) {
        ev.stopPropagation();
        startEditPost(this.getAttribute("data-edit-id"));
      };
    }

    var deleteBtns = document.querySelectorAll(".delete-btn");
    for (var d = 0; d < deleteBtns.length; d++) {
      deleteBtns[d].onclick = function(e) {
        e.stopPropagation();
        deletePost(this.getAttribute("data-delete-id"));
      };
    }

    renderDetail(posts[0]);
  }

  function renderDetail(post) {
    var actionHtml = "";
    if (isAdmin) {
      actionHtml =
        '<div class="detail-actions">' +
          '<button type="button" id="detailEditBtn" data-id="' + escapeHtml(post.id) + '">수정</button>' +
          '<button type="button" id="detailDeleteBtn" class="detail-delete" data-id="' + escapeHtml(post.id) + '">삭제</button>' +
        '</div>';
    }

    boardDetail.innerHTML =
      '<div class="detail-title">' + escapeHtml(post.title || "(제목 없음)") + '</div>' +
      '<div class="detail-meta">글쓴이: ' + escapeHtml(post.writer || "글쓴이 없음") +
      ' &nbsp; | &nbsp; 날짜: ' + escapeHtml(getPostDateText(post)) + '</div>' +
      getAttachmentDetailHtml(post) +
      '<div class="detail-content">' + escapeHtml(post.content || "").replace(/\n/g, "<br>") + '</div>' +
      actionHtml;

    var detailEditBtn = document.getElementById("detailEditBtn");
    var detailDeleteBtn = document.getElementById("detailDeleteBtn");

    if (detailEditBtn) {
      detailEditBtn.onclick = function() {
        startEditPost(this.getAttribute("data-id"));
      };
    }

    if (detailDeleteBtn) {
      detailDeleteBtn.onclick = function() {
        deletePost(this.getAttribute("data-id"));
      };
    }
  }

  function applySearch() {
    var keyword = (searchInput.value || "").toLowerCase().trim();
    if (!keyword) {
      renderPosts(cachedPosts);
      return;
    }

    var filtered = cachedPosts.filter(function(post) {
      return String(post.title || "").toLowerCase().indexOf(keyword) > -1 ||
             String(post.writer || "").toLowerCase().indexOf(keyword) > -1 ||
             String(post.content || "").toLowerCase().indexOf(keyword) > -1;
    });

    renderPosts(filtered);
  }

  function loadPosts() {
    if (!db) return;

    setStatus("");

    db.collection("boards")
      .orderBy("createdAt", "desc")
      .get()
      .then(function(snapshot) {
        cachedPosts = [];
        snapshot.forEach(function(doc) {
          var data = doc.data();
          data.id = doc.id;
          cachedPosts.push(data);
        });
        applySearch();
        setStatus("");
      })
      .catch(function(error) {
        console.error(error);

        db.collection("boards").get()
          .then(function(snapshot) {
            cachedPosts = [];
            snapshot.forEach(function(doc) {
              var data = doc.data();
              data.id = doc.id;
              cachedPosts.push(data);
            });
            cachedPosts.sort(function(a, b) {
              return String(formatDate(b.createdAt)).localeCompare(String(formatDate(a.createdAt)));
            });
            applySearch();
            setStatus("");
          })
          .catch(function(error2) {
            console.error(error2);
            setStatus("게시글을 불러오지 못했습니다. Firestore 규칙 또는 인터넷 연결을 확인하세요.", true);
            boardList.innerHTML = '<tr><td colspan="5" class="empty">Firebase 연결 실패</td></tr>';
          });
      });
  }

  function startEditPost(id) {
    if (!isAdmin) {
      alert("관리자만 수정할 수 있습니다.");
      return;
    }

    var post = null;
    for (var i = 0; i < cachedPosts.length; i++) {
      if (cachedPosts[i].id === id) {
        post = cachedPosts[i];
        break;
      }
    }

    if (!post) {
      alert("수정할 글을 찾지 못했습니다.");
      return;
    }

    editingPostId = id;
    titleInput.value = post.title || "";
    writerInput.value = post.writer || "관리자";
    contentInput.value = post.content || "";
    attachmentUrlInput.value = post.attachmentUrl || post.attachmentLink || post.fileUrl || post.downloadUrl || "";
    attachmentNameInput.value = post.attachmentName || post.fileName || post.filename || "";
    if (attachmentKindInput) {
      var editKind = post.attachmentKind || post.fileKind || post.kind || "auto";
      attachmentKindInput.value = (editKind === "image" || editKind === "video" || editKind === "doc") ? editKind : "auto";
    }

    writeTitleText.innerHTML = "글 수정";
    editingLabel.innerHTML = "선택한 글을 수정 중입니다.";
    savePostBtn.innerHTML = "수정 저장";
    cancelEditBtn.style.display = "";

    writeBox.className = "write-box show";
    if (writeToggleBtn) writeToggleBtn.innerHTML = "글쓰기 닫기";

    try {
      writeBox.scrollIntoView({behavior:"smooth", block:"start"});
    } catch (e) {}
  }

  function savePost(e) {
    e.preventDefault();

    var title = titleInput.value.trim();
    var writer = writerInput.value.trim() || (isAdmin ? "관리자" : "글쓴이 없음");
    var content = contentInput.value.trim();

    if (!title) {
      alert("제목을 입력하세요.");
      titleInput.focus();
      return;
    }

    if (!content) {
      alert("내용을 입력하세요.");
      contentInput.focus();
      return;
    }

    if (editingPostId) {
      if (!isAdmin) {
        alert("수정은 관리자만 할 수 있습니다.");
        return;
      }

      var editAttachment = getAttachmentLinkData();
      var updateData = {
        title: title,
        writer: writer,
        content: content,
        attachmentUrl: editAttachment.attachmentUrl,
        attachmentName: editAttachment.attachmentName,
        attachmentKind: editAttachment.attachmentKind,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
        updatedBy: currentUser ? currentUser.email : ""
      };

      setStatus("게시글을 수정하는 중입니다...");
      db.collection("boards").doc(editingPostId).update(updateData)
      .then(function() {
        resetWriteForm();
        writeBox.className = "write-box";
        if (writeToggleBtn) writeToggleBtn.innerHTML = "글쓰기";
        setStatus("게시글이 수정되었습니다.");
        loadPosts();
      })
      .catch(function(error) {
        console.error(error);
        setStatus("게시글 수정에 실패했습니다. Firestore 규칙을 확인하세요.", true);
        alert("수정 실패: " + error.message);
      });

      return;
    }

    var newAttachment = getAttachmentLinkData();
    var postData = {
      title: title,
      writer: writer,
      content: content,
      attachmentUrl: newAttachment.attachmentUrl,
      attachmentName: newAttachment.attachmentName,
      attachmentKind: newAttachment.attachmentKind,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      uid: currentUser ? currentUser.uid : "",
      email: currentUser ? currentUser.email : ""
    };

    setStatus("게시글을 저장하는 중입니다...");
    db.collection("boards").add(postData)
    .then(function() {
      resetWriteForm();
      writeBox.className = "write-box";
      if (writeToggleBtn) writeToggleBtn.innerHTML = "글쓰기";
      setStatus("게시글이 저장되었습니다.");
      loadPosts();
    })
    .catch(function(error) {
      console.error(error);
      setStatus("게시글 저장에 실패했습니다. Firestore 규칙을 확인하세요.", true);
      alert("저장 실패: " + error.message);
    });
  }

  function deletePost(id) {
    if (!isAdmin) {
      alert("관리자만 삭제할 수 있습니다.");
      return;
    }

    if (!confirm("이 글을 삭제할까요?")) return;

    setStatus("게시글을 삭제하는 중입니다...");

    db.collection("boards").doc(id).delete()
      .then(function() {
        if (editingPostId === id) {
          resetWriteForm();
        }
        setStatus("게시글이 삭제되었습니다.");
        loadPosts();
      })
      .catch(function(error) {
        console.error(error);
        setStatus("삭제 실패. Firestore 규칙을 확인하세요.", true);
        alert("삭제 실패: " + error.message);
      });
  }

  function login() {
    var email = loginEmail.value.trim();
    var password = loginPassword.value;

    if (!email || !password) {
      alert("이메일과 비밀번호를 입력하세요.");
      return;
    }

    setAuthMessage("로그인 중입니다...", false);

    firebase.auth().signInWithEmailAndPassword(email, password)
      .catch(function(error) {
        console.error(error);
        setAuthMessage("로그인 실패: " + error.message, true);
      });
  }

  function logout() {
    firebase.auth().signOut();
  }

  function start() {
    try {
      if (!window.firebase) {
        setStatus("Firebase SDK를 불러오지 못했습니다. 인터넷 연결을 확인하세요.", true);
        return;
      }

      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }

      db = firebase.firestore();

      writeForm.onsubmit = savePost;
      searchInput.oninput = applySearch;
      reloadBtn.onclick = loadPosts;
      loginBtn.onclick = login;
      logoutBtn.onclick = logout;
      cancelEditBtn.onclick = function() {
        resetWriteForm();
        writeBox.className = "write-box";
        if (writeToggleBtn) writeToggleBtn.innerHTML = "글쓰기";
      };
      adminToggleBtn.onclick = function() {
        togglePanel(authBox, adminToggleBtn, "관리자 로그인", "관리자 로그인 닫기");
      };
      writeToggleBtn.onclick = function() {
        togglePanel(writeBox, writeToggleBtn, "글쓰기", "글쓰기 닫기");
      };
      attachmentCloseBtn.onclick = closeAttachmentPopup;
      attachmentFullBtn.onclick = function() {
        if (currentAttachmentUrl) window.open(currentAttachmentUrl, "_blank", "noopener");
      };
      attachmentPopupMask.onclick = function(ev) {
        if (ev.target === attachmentPopupMask) closeAttachmentPopup();
      };
      document.onclick = function(ev) {
        var target = ev.target || ev.srcElement;
        if (target && target.className && String(target.className).indexOf("attachment-open-btn") > -1) {
          ev.stopPropagation();
          openAttachmentPopup(target.getAttribute("data-url"), target.getAttribute("data-name"), target.getAttribute("data-kind"));
        }
      };

      firebase.auth().onAuthStateChanged(function(user) {
        currentUser = user;
        isAdmin = !!(user && user.email === ADMIN_EMAIL);
        updateAuthUI();
      });

      loadPosts();
    } catch (error) {
      console.error(error);
      setStatus("Firebase 초기화 실패: " + error.message, true);
    }
  }

  start();
})();
</script>
</body>
</html>
